<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium 3D Restaurant Menu - Digital Board</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .menu-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            pointer-events: none;
        }

        .header {
            text-align: center;
            z-index: 10;
        }

        .restaurant-logo {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b00, #ffa500, #ff6b00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 107, 0, 0.5);
            letter-spacing: 2px;
            margin-bottom: 10px;
            animation: glow-pulse 3s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% { text-shadow: 0 0 20px rgba(255, 107, 0, 0.3), 0 0 40px rgba(255, 107, 0, 0.2); }
            50% { text-shadow: 0 0 30px rgba(255, 107, 0, 0.6), 0 0 60px rgba(255, 107, 0, 0.3); }
        }

        .tagline {
            font-size: 1.2rem;
            color: #ff6b00;
            letter-spacing: 1px;
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
            z-index: 10;
        }

        .nav-item {
            font-size: 1.8rem;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 15px;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(255, 107, 0, 0);
            border: 2px solid transparent;
        }

        .nav-item.active {
            background: rgba(255, 107, 0, 0.2);
            border: 2px solid #ff6b00;
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.6), inset 0 0 20px rgba(255, 107, 0, 0.1);
            animation: nav-glow 2s ease-in-out infinite;
        }

        @keyframes nav-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 107, 0, 0.6), inset 0 0 20px rgba(255, 107, 0, 0.1); }
            50% { box-shadow: 0 0 40px rgba(255, 107, 0, 0.8), inset 0 0 30px rgba(255, 107, 0, 0.2); }
        }

        .nav-item:hover {
            transform: scale(1.1);
            color: #ff6b00;
        }

        .main-content {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex: 1;
            gap: 60px;
            z-index: 5;
        }

        .food-display {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .food-info {
            flex: 0.6;
            background: rgba(255, 107, 0, 0.05);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 107, 0, 0.3);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(255, 107, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: slideInRight 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        .food-info::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 107, 0, 0.1) 0%, transparent 70%);
            animation: moveLight 8s ease-in-out infinite;
        }

        @keyframes moveLight {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }

        .food-info > * {
            position: relative;
            z-index: 1;
        }

        .product-name {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff, #ffa500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: slideInLeft 0.8s ease-out 0.1s both;
        }

        .product-description {
            font-size: 1.4rem;
            color: #d0d0d0;
            margin-bottom: 30px;
            line-height: 1.6;
            animation: slideInLeft 0.8s ease-out 0.2s both;
        }

        .badges {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            animation: slideInLeft 0.8s ease-out 0.3s both;
        }

        .badge {
            background: linear-gradient(135deg, #ff6b00, #ff8c00);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(255, 107, 0, 0.4);
        }

        .price-section {
            display: flex;
            gap: 20px;
            align-items: baseline;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid rgba(255, 107, 0, 0.3);
            animation: slideInLeft 0.8s ease-out 0.4s both;
        }

        .price {
            font-size: 4rem;
            font-weight: 900;
            color: #ff6b00;
            text-shadow: 0 0 20px rgba(255, 107, 0, 0.6);
            animation: priceReveal 0.8s ease-out 0.5s both;
        }

        .currency {
            font-size: 2rem;
        }

        .original-price {
            font-size: 1.8rem;
            color: #777;
            text-decoration: line-through;
            animation: fadeIn 0.8s ease-out 0.6s both;
        }

        .discount-badge {
            background: #ff3333;
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            animation: fadeIn 0.8s ease-out 0.6s both;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes priceReveal {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .promo-section {
            background: linear-gradient(135deg, rgba(255, 50, 50, 0.1), rgba(255, 107, 0, 0.1));
            border: 2px solid rgba(255, 50, 50, 0.3);
            border-radius: 20px;
            padding: 30px;
            margin-top: 30px;
            text-align: center;
            animation: slideInLeft 0.8s ease-out 0.5s both;
        }

        .promo-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff3333;
            margin-bottom: 10px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .promo-description {
            font-size: 1.3rem;
            color: #ffa500;
            font-weight: bold;
        }

        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .progress-indicator {
            display: flex;
            gap: 8px;
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 107, 0, 0.3);
            transition: all 0.3s ease;
        }

        .progress-dot.active {
            background: #ff6b00;
            width: 30px;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(255, 107, 0, 0.6);
        }

        .controls-hidden {
            display: none !important;
        }

        .admin-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 107, 0, 0.1);
            border: 2px solid #ff6b00;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .admin-toggle:hover {
            background: rgba(255, 107, 0, 0.3);
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.5);
        }

        .admin-panel {
            position: fixed;
            top: 0;
            right: -450px;
            width: 450px;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            border-left: 2px solid #ff6b00;
            padding: 30px;
            overflow-y: auto;
            z-index: 999;
            transition: right 0.3s ease;
            box-shadow: -5px 0 30px rgba(0, 0, 0, 0.5);
        }

        .admin-panel.open {
            right: 0;
        }

        .admin-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 1.5rem;
            color: #ff6b00;
        }

        .admin-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 30px;
            color: #ff6b00;
        }

        .admin-section {
            margin-bottom: 30px;
        }

        .admin-label {
            display: block;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .admin-input,
        .admin-select,
        .admin-textarea {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 107, 0, 0.5);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .admin-input:focus,
        .admin-select:focus,
        .admin-textarea:focus {
            outline: none;
            border-color: #ff6b00;
            box-shadow: 0 0 10px rgba(255, 107, 0, 0.3);
        }

        .admin-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff6b00, #ffa500);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-button:hover {
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.6);
            transform: translateY(-2px);
        }

        .tv-mode-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 200, 100, 0.2);
            border: 2px solid #00c864;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #00c864;
            z-index: 100;
            animation: tvIndicatorPulse 2s ease-in-out infinite;
        }

        @keyframes tvIndicatorPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(0, 200, 100, 0.3); }
            50% { box-shadow: 0 0 20px rgba(0, 200, 100, 0.6); }
        }

        @media (max-width: 1920px) {
            .restaurant-logo { font-size: 2.5rem; }
            .product-name { font-size: 2.2rem; }
            .price { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="menu-container">
        <div class="header">
            <div class="restaurant-logo">🍽️ GOURMET STATION</div>
            <div class="tagline">Premium Fast Food Experience</div>
            <div class="navigation">
                <div class="nav-item active" data-category="doener">🌯 DÖNER</div>
                <div class="nav-item" data-category="pizza">🍕 PIZZA</div>
                <div class="nav-item" data-category="burger">🍔 BURGER</div>
                <div class="nav-item" data-category="snacks">🍟 SNACKS</div>
                <div class="nav-item" data-category="drinks">🥤 GETRÄNKE</div>
                <div class="nav-item" data-category="dessert">🍰 DESSERT</div>
            </div>
        </div>

        <div class="main-content">
            <div class="food-display">
                <canvas id="food-canvas" style="width: 600px; height: 600px;"></canvas>
            </div>
            <div class="food-info">
                <div class="product-name" id="product-name">Döner Kebab</div>
                <div class="product-description" id="product-description">
                    Saftiges Döner-Fleisch, frischer Salat, Tomate, Zwiebel und würzige Sauce
                </div>
                <div class="badges" id="badges"></div>
                <div class="price-section">
                    <div class="price" id="price">7<span class="currency">,50€</span></div>
                </div>
                <div class="promo-section" id="promo-section" style="display: none;">
                    <div class="promo-title">🔥 SPEZIALANGEBOT 🔥</div>
                    <div class="promo-description" id="promo-text">Döner + Cola nur 7,99€</div>
                </div>
            </div>
        </div>

        <div class="bottom-section">
            <div class="progress-indicator" id="progress-indicator"></div>
        </div>
    </div>

    <div class="tv-mode-indicator" id="tv-mode-indicator" style="display: none;">📺 TV MODE</div>

    <div class="admin-toggle" id="admin-toggle">⚙️</div>

    <div class="admin-panel" id="admin-panel">
        <div class="admin-close" id="admin-close">✕</div>
        <div class="admin-title">Admin Panel</div>

        <div class="admin-section">
            <label class="admin-label">Restaurant Name</label>
            <input type="text" class="admin-input" id="admin-restaurant-name" value="GOURMET STATION">
        </div>

        <div class="admin-section">
            <label class="admin-label">Restaurant Tagline</label>
            <input type="text" class="admin-input" id="admin-tagline" value="Premium Fast Food Experience">
        </div>

        <div class="admin-section">
            <label class="admin-label">Background Color</label>
            <input type="color" class="admin-input" id="admin-bg-color" value="#0a0a0a">
        </div>

        <div class="admin-section">
            <label class="admin-label">Primary Color</label>
            <input type="color" class="admin-input" id="admin-primary-color" value="#ff6b00">
        </div>

        <div class="admin-section">
            <label class="admin-label">Slideshow Duration (seconds)</label>
            <input type="number" class="admin-input" id="admin-slideshow-duration" value="10" min="5" max="30">
        </div>

        <div class="admin-section">
            <label class="admin-label">Animation Speed</label>
            <select class="admin-select" id="admin-animation-speed">
                <option value="slow">Slow</option>
                <option value="normal" selected>Normal</option>
                <option value="fast">Fast</option>
            </select>
        </div>

        <div class="admin-section">
            <label class="admin-label">Enable Sound</label>
            <input type="checkbox" id="admin-sound" style="width: 20px; height: 20px;">
        </div>

        <div class="admin-section">
            <label class="admin-label">TV Mode (Auto-rotate)</label>
            <input type="checkbox" id="admin-tv-mode" style="width: 20px; height: 20px;">
        </div>

        <button class="admin-button" id="admin-save">Save Settings</button>
        <button class="admin-button" id="admin-reset" style="margin-top: 10px; background: linear-gradient(135deg, #666, #888);">Reset to Default</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/food-renderer.js"></script>
    <script src="js/menu-controller.js"></script>
    <script src="js/admin-panel.js"></script>
</body>
</html>
